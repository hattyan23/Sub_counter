<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>登録者数</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; text-align: center;
         font-family: sans-serif; font-weight: 700; color: #fff; overflow: hidden;
         text-shadow: 0 0 .08em #000, 0 0 .08em #000, 0 0 .2em #000; }
  /* OBS 側の幅・高さがいくつでも収まるように、枠の大きさに合わせて文字を拡大縮小する */
  #count { font-size: min(25vw, 90vh); line-height: 1; }
  #notice { font-size: min(5vw, 12vh); line-height: 1.5; padding: 0 4vw; }
  #notice small { display: block; font-size: .65em; }
  #count.placeholder { opacity: .5; }
</style>
</head>
<body>
<div id="count"></div>
<div id="notice"></div>
<script>
  const countEl = document.getElementById("count");
  const noticeEl = document.getElementById("notice");
  // 数字がまだないときだけ、設定の問題なら案内を、それ以外（一時的な問題など）なら「---」を出す。
  // 一度表示できたら、取得に失敗してもサーバーは前回の値を送るので、配信画面にエラーは出さない。
  // 接続が切れた場合は EventSource が自動で再接続する。
  const OPEN_SETTINGS = "画面右下の赤いアイコンを右クリックして「設定を開く」を選んでください";
  const NOTICES = {
    not_configured: ["API キーとチャンネル ID を設定してください", OPEN_SETTINGS],
    key_invalid: ["API キーを確認してください", OPEN_SETTINGS],
    channel_not_found: ["チャンネル ID を確認してください", OPEN_SETTINGS],
    subscribers_hidden: ["登録者数が非公開になっています", "YouTube の設定で登録者数を公開してください"],
  };

  function showNotice([title, detail]) {
    noticeEl.textContent = title;
    const small = document.createElement("small");
    small.textContent = detail;
    noticeEl.append(small);
  }

  new EventSource("/events").onmessage = (e) => {
    const { count, status } = JSON.parse(e.data);
    const notice = count === null ? NOTICES[status] : null;
    noticeEl.replaceChildren();
    countEl.classList.toggle("placeholder", count === null);
    countEl.textContent = count !== null ? count : notice ? "" : "---";
    if (notice) showNotice(notice);
  };
</script>
</body>
</html>
